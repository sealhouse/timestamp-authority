name: sealhouse-merge

on:
  push:
    branches: [rhtas/main, 'release-*']

permissions: {}

jobs:
  merge:
    permissions:
      packages: write
    uses: sealhouse/ci/.github/workflows/merge.yaml@e8906322470ff2f37d20be64c9377f88546c1946
    with:
      ci-ref: e8906322470ff2f37d20be64c9377f88546c1946
      image: true
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
