name: sealhouse-merge

on:
  push:
    branches: [rhtas/main, 'release-*']

permissions: {}

jobs:
  merge:
    permissions:
      packages: write
    uses: sealhouse/ci/.github/workflows/merge.yaml@3d709872411ce0658c40ec5619750de80ab74257
    with:
      ci-ref: 3d709872411ce0658c40ec5619750de80ab74257
      image: true
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
