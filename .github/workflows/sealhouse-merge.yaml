name: sealhouse-merge

on:
  push:
    branches: [rhtas/main, 'release-*']

permissions: {}

jobs:
  merge:
    permissions:
      packages: write
    uses: sealhouse/ci/.github/workflows/merge.yaml@75a727d99331491cd1ab3d8eb874e7988da95b06
    with:
      ci-ref: 75a727d99331491cd1ab3d8eb874e7988da95b06
      image: true
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
