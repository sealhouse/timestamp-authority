name: sealhouse-merge

on:
  push:
    branches: [rhtas/main, 'release-*']

permissions: {}

jobs:
  merge:
    permissions:
      packages: write
    uses: sealhouse/ci/.github/workflows/merge.yaml@5c4dc04ff6662d7f6f49e6342d258328cc6e9fa8
    with:
      ci-ref: 5c4dc04ff6662d7f6f49e6342d258328cc6e9fa8
      image: true
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
