name: sealhouse-merge

on:
  push:
    branches: [rhtas/main, 'release-*']

permissions: {}

jobs:
  merge:
    permissions:
      packages: write
    uses: sealhouse/ci/.github/workflows/merge.yaml@a3d140c92fc80187d4d442704b8d9cd3495a2ab5
    with:
      ci-ref: a3d140c92fc80187d4d442704b8d9cd3495a2ab5
      image: true
    secrets:
      dispatch-app-id: ${{ secrets.SEALHOUSE_DISPATCH_APP_ID }}
      dispatch-app-key: ${{ secrets.SEALHOUSE_DISPATCH_APP_KEY }}
